<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
</head>
<body>

<h2>Admin Login</h2>

<input id="username" placeholder="Enter Username"><br><br>
<input id="password" type="password" placeholder="Enter Password"><br><br>

<button onclick="login()">Login</button>

<script>
const backend = "https://amsareescentre-backend.onrender.com";

async function login() {
  let res = await fetch(backend + "/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  });

  let data = await res.json();

  if(data.success){
    alert("Login Success");
  } else {
    alert("Wrong Username or Password");
  }
}
</script>

</body>
</html>
