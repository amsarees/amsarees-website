<!DOCTYPE html>
<html>
<head>
  <title>AMS Admin Login</title>
</head>

<body>

<h2>Admin Login</h2>

<input id="email" placeholder="Enter Email"><br><br>
<button onclick="sendOtp()">Send OTP</button><br><br>

<input id="otp" placeholder="Enter OTP"><br><br>
<button onclick="verifyOtp()">Login</button>

<script>

const backend = "https://amsareescentre-backend.onrender.com";

async function sendOtp() {
  await fetch(backend + "/send-otp", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: document.getElementById("email").value
    })
  });
  alert("OTP sent to email");
}

async function verifyOtp() {
  let res = await fetch(backend + "/verify-otp", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: document.getElementById("email").value,
      otp: document.getElementById("otp").value
    })
  });

  let data = await res.json();

  if(data.success) {
    alert("Login Success");
  } else {
    alert("Wrong OTP");
  }
}

</script>

</body>
</html>
