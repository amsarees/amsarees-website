<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collections – A.M. Sarees Centre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo">
    <h1>A.M. Sarees Centre – Elegance in Every Drape</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="collections.html">Collections</a>
      <a href="new.html">New Arrivals</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <a href="admin.html">Login</a>
    </nav>
  </header>

  <h2>Our Saree Collections</h2>
  <div id="catalogue"></div>

  <script>
    fetch("https://amsareescentre-backend.onrender.com/products")
      .then(res => res.json())
      .then(data => {
        data.forEach(product => {
          document.querySelector("#catalogue").innerHTML += `
            <div class="product">
              <img src="${product.image}" alt="${product.name}">
              <h3>${product.name}</h3>
              <p>₹${product.price}</p>
              <a href="https://wa.me/9395142435?text=Order ${product.name}">Order on WhatsApp</a>
            </div>
          `;
        });
      });
  </script>
</body>
</html>
