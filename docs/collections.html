<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collections – A.M. Sarees Centre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Our Collections</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="collections.html">Collections</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <section>
    <h2>All Products</h2>
    <div id="collections"></div>
  </section>

  <script>
    async function loadCollections() {
      const res = await fetch("https://amsareescentre-backend.onrender.com/products");
      const data = await res.json();
      const container = document.getElementById("collections");
      container.innerHTML = "";

      data.forEach(product => {
        container.innerHTML += `
          <div class="product">
            <img src="https://amsareescentre-backend.onrender.com${product.image}" alt="${product.name}" style="max-width:150px;">
            <h4>${product.name}</h4>
            <p>₹${product.price}</p>
            <p>Catalogue: ${product.catalogue}</p>
            <a href="product.html?id=${product.id}">View Details</a>
            <button onclick="addToCart(${product.id})">Add to Cart</button>
          </div>
        `;
      });
    }

    function addToCart(id) {
      fetch("https://amsareescentre-backend.onrender.com/products")
        .then(res => res.json())
        .then(products => {
          const product = products.find(p => p.id == id);
          let cart = JSON.parse(localStorage.getItem("cart")) || [];
          let existing = cart.find(item => item.id == id);
          if (existing) {
            existing.qty += 1;
          } else {
            cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
          }
          localStorage.setItem("cart", JSON.stringify(cart));
          alert("Added to cart!");
        });
    }

    loadCollections();
  </script>
</body>
</html>
