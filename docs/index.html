<!DOCTYPE html>
<html>
<head>
  <title>A.M. Sarees Centre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="images/logo.png" alt="Logo">
  <h1>A.M. Sarees Centre</h1>
  <p>Elegance in Every Drape</p>
  <nav>
    <a href="index.html">Home</a>
    <a href="collections.html">Collections</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>

<div class="banner">
  <h2>NEW COLLECTION</h2>
  <p>SAREES THAT DEFINE YOU<br>TRADITIONAL • ELEGANT • TIMELESS</p>
  <button onclick="location.href='collections.html'">SHOP NOW</button>
</div>

<h2>New Arrivals</h2>
<div id="newArrivals"></div>

<script>
fetch("https://amsareescentre-backend.onrender.com/products")
  .then(res => res.json())
  .then(products => {
    const container = document.getElementById("newArrivals");
    products.slice(0,5).forEach(p => {
      container.innerHTML += `
        <div class="product">
          <img src="${p.image}">
          <h3>${p.name}</h3>
          <p>₹${p.price}</p>
          <button onclick="addToCart('${p._id}')">Add to Cart</button>
        </div>
      `;
    });
  });

function addToCart(id) {
  fetch("https://amsareescentre-backend.onrender.com/products")
    .then(res => res.json())
    .then(products => {
      const product = products.find(p => p._id == id);
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      let existing = cart.find(item => item._id == id);
      if (existing) existing.qty += 1;
      else cart.push({ ...product, qty: 1 });
      localStorage.setItem("cart", JSON.stringify(cart));
      alert(product.name + " added to cart!");
    });
}
</script>

<footer>
  S.no 21-1-579 Near 94 Bus Stop, High Court Road, Rikab Gunj, Hyderabad -02 (T.G.)<br>
  Phone: 9395142435 / 9849258288
</footer>
</body>
</html>
