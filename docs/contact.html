<!DOCTYPE html>
<html lang="en">
<head>

  <title>Contact Us – A.M. Sarees Centre</title>

</head>
<body>

  <section class="contact">
    <h2>Contact Us</h2>
    <div id="contactContent"></div>
  </section>
  <footer> ...same footer... </footer>

    fetch("https://amsareescentre-backend.onrender.com/contact")

      });
  </script>
</body>
</html>
