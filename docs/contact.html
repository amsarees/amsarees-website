<!DOCTYPE html>
<html>
<head>
  <title>Contact Us</title>

<body>
<header>

  <h1>A.M. Sarees Centre</h1>
  <nav>

<h2>Contact Us</h2>
<div id="contact"></div>

<script>
fetch("https://amsareescentre-backend.onrender.com/contact")
  .then(res => res.json())
  .then(data => {
    document.getElementById("contact").innerHTML = `
      <p>Address: ${data?.address || ""}</p>
      <p>Phone: ${data?.phone || ""}</p>
      <p>Email: ${data?.email || ""}</p>
    `;
  });
</script>

<footer>
  <p>Customer Support: +91 9395142435</p>
</footer>
</body>
</html>
