<h1>Admin Panel</h1>
<form id="productForm" enctype="multipart/form-data">
  <input type="text" name="name" placeholder="Product Name" required><br>
  <input type="number" name="price" placeholder="Price" required><br>
  <input type="number" name="quantity" placeholder="Quantity" required><br>
  <input type="text" name="catalogue" placeholder="Catalogue" required><br>
  <input type="file" name="image" required><br>
  <button type="submit">Save Product</button>
</form>

<h2>Edit About Us</h2>
<textarea id="aboutText"></textarea><br>
<button onclick="saveAbout()">Save About Us</button>

<h2>Edit Contact Us</h2>
<input type="text" id="address" placeholder="Address"><br>
<input type="text" id="phone" placeholder="Phone"><br>
<input type="email" id="email" placeholder="Email"><br>
<button onclick="saveContact()">Save Contact Us</button>

<script>
document.getElementById("productForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  await fetch("https://amsareescentre-backend.onrender.com/products", {
    method: "POST",
    body: formData
  });
  alert("Product saved!");
});

function saveAbout() {
  const text = document.getElementById("aboutText").value;
  fetch("https://amsareescentre-backend.onrender.com/about", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ about: text })
  });
  alert("About Us updated!");
}

function saveContact() {
  const address = document.getElementById("address").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  fetch("https://amsareescentre-backend.onrender.com/contact", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ address, phone, email })
  });
  alert("Contact Us updated!");
}
</script>
