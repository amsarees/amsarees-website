<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel – A.M. Sarees Centre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Admin Login</h2>
  <form id="loginForm">
    <input type="text" placeholder="Username" id="username">
    <input type="password" placeholder="Password" id="password">
    <button type="submit">Login</button>
  </form>

  <div id="adminPanel" style="display:none;">
    <h3>Manage Products</h3>
    <form id="addProductForm" enctype="multipart/form-data">
      <input type="text" placeholder="Product Name" id="name">
      <input type="number" placeholder="Price" id="price">
      <input type="number" placeholder="Quantity" id="quantity">

      <!-- Catalogue select -->
      <select id="catalogue">
        <option value="Cotton Sarees">Cotton Sarees</option>
        <option value="Silk Sarees">Silk Sarees</option>
        <option value="Fancy Sarees">Fancy Sarees</option>
        <option value="Handloom Sarees">Handloom Sarees</option>
        <option value="Daily Wear">Daily Wear</option>
      </select>

      <!-- Photo upload -->
      <input type="file" id="image" accept="image/*">
      <button type="submit">Add Product</button>
    </form>

    <h3>About Us</h3>
    <textarea id="aboutText" placeholder="Write about your shop..."></textarea>
    <button onclick="saveAbout()">Save About Us</button>

    <h3>Contact Us</h3>
    <textarea id="contactText" placeholder="Write contact details..."></textarea>
    <button onclick="saveContact()">Save Contact Us</button>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const adminPanel = document.getElementById("adminPanel");

    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if(user === "amsareescentre" && pass === "amsarees786@") {
        loginForm.style.display = "none";
        adminPanel.style.display = "block";
      } else {
        alert("Invalid credentials!");
      }
    });

    // Add Product
    document.getElementById("addProductForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const formData = new FormData();
      formData.append("name", document.getElementById("name").value);
      formData.append("price", document.getElementById("price").value);
      formData.append("quantity", document.getElementById("quantity").value);
      formData.append("catalogue", document.getElementById("catalogue").value);
      formData.append("image", document.getElementById("image").files[0]);

      const res = await fetch("https://amsareescentre-backend.onrender.com/add-product", {
        method: "POST",
        body: formData
      });

      const data = await res.json();
      alert("Product added successfully in " + document.getElementById("catalogue").value + "!");
    });

    // Save About Us
    async function saveAbout() {
      const aboutText = document.getElementById("aboutText").value;
      const res = await fetch("https://amsareescentre-backend.onrender.com/save-about", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ about: aboutText })
      });
      const data = await res.json();
      alert("About Us updated successfully!");
    }

    // Save Contact Us
    async function saveContact() {
      const contactText = document.getElementById("contactText").value;
      const res = await fetch("https://amsareescentre-backend.onrender.com/save-contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contact: contactText })
      });
      const data = await res.json();
      alert("Contact Us updated successfully!");
    }
  </script>
</body>
</html>
