<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel – A.M. Sarees Centre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Admin Login</h2>
  <form id="loginForm">
    <input type="text" placeholder="Username" id="username">
    <input type="password" placeholder="Password" id="password">
    <button type="submit">Login</button>
  </form>

  <div id="adminPanel" style="display:none;">
    <h3>Manage Products</h3>
    <form id="addProductForm">
      <input type="text" placeholder="Product Name" id="name">
      <input type="number" placeholder="Price" id="price">
      <input type="number" placeholder="Quantity" id="quantity">
      <input type="text" placeholder="Image URL" id="image">
      <button type="submit">Add Product</button>
    </form>

    <h3>About Us</h3>
    <textarea id="aboutText" placeholder="Write about your shop..."></textarea>
    <button onclick="saveAbout()">Save About Us</button>

    <h3>Contact Us</h3>
    <textarea id="contactText" placeholder="Write contact details..."></textarea>
    <button onclick="saveContact()">Save Contact Us</button>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const adminPanel = document.getElementById("adminPanel");

    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if(user === "amsareescentre" && pass === "amsarees786@") {
        loginForm.style.display = "none";
        adminPanel.style.display = "block";
      } else {
        alert("Invalid credentials!");
      }
    });

    document.getElementById("addProductForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const product = {
        name: document.getElementById("name").value,
        price: document.getElementById("price").value,
        quantity: document.getElementById("quantity").value,
        image: document.getElementById("image").value
      };
      fetch("https://amsareescentre-backend.onrender.com/add-product", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(product)
      }).then(res => res.json()).then(data => {
        alert("Product added successfully!");
      });
    });

    function saveAbout() {
      alert("About Us saved: " + document.getElementById("aboutText").value);
    }
    function saveContact() {
      alert("Contact Us saved: " + document.getElementById("contactText").value);
    }
  </script>
</body>
</html>
