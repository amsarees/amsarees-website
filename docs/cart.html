<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart - A.M. Sarees Centre</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .cart-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px;
      display: flex;
      align-items: center;
    }
    .cart-item img {
      max-width: 100px;
      margin-right: 10px;
    }
    .order-btn {
      background: green;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Your Cart</h1>
  <div id="cart"></div>
  <button class="order-btn" onclick="placeOrder()">Place WhatsApp Order</button>

  <script>
    function loadCart() {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      const container = document.getElementById("cart");
      container.innerHTML = "";

      cart.forEach(item => {
        container.innerHTML += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}">
            <div>
              <h4>${item.name}</h4>
              <p>Price: ₹${item.price}</p>
              <p>Quantity: ${item.qty}</p>
            </div>
          </div>
        `;
      });
    }

    function placeOrder() {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      let message = "Order Details:%0A";
      cart.forEach(item => {
        message += `${item.name} - Qty: ${item.qty} - Price: ₹${item.price}%0A`;
      });
      // ✅ Replace with your WhatsApp number
      window.open(`https://wa.me/919395142435?text=${message}`, "_blank");
    }

    loadCart();
  </script>
</body>
</html>
